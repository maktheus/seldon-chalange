name: Publicar o site do desafio

# O ambiente github-pages só aceita deploy a partir da branch default do
# repositório. Hoje a default é ccr-5b59ccd5-6yjr77, não main: uma execução
# disparada em main é recusada pelo ambiente antes de alocar runner, sem log.
# As duas branches ficam listadas para que o deploy continue funcionando se a
# default mudar.
on:
  push:
    branches: [ccr-5b59ccd5-6yjr77, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Montar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o diretório publicável
        run: node scripts/build-pages.js

      - name: Habilitar e configurar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
